name: Build and publish release

on:
  pull_request:
    branches:
      - master
    types:
      - closed

# Required repository variables:
# AFT_KEYSTORE_BASE64, AFT_KEYSTORE_PASSWORD, AFT_KEY_ALIAS, AFT_KEY_PASSWORD
permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    # A closed PR may have been declined; publish only a merged one.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Validate release version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PR title must be a version tag in the form vX.Y.Z; received: $PR_TITLE" >&2
            exit 1
          fi

          echo "tag=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "name=${PR_TITLE#v}" >> "$GITHUB_OUTPUT"

      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Ensure app version matches release tag
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          source_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [[ "$source_version" != "$VERSION" ]]; then
            echo "app/build.gradle.kts has versionName '$source_version', but the PR title is 'v$VERSION'." >&2
            echo "Update versionName in the PR so AppUpdateRepositoryImpl generates valid release URLs." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ vars.AFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ vars.AFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.AFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ vars.AFT_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "A required signing repository variable is empty or missing." >&2
              exit 1
            fi
            echo "::add-mask::$value"
          done

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aftools-release.jks"

      - name: Build signed APKs
        env:
          KEYSTORE_PASSWORD: ${{ vars.AFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.AFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ vars.AFT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:assembleIslandAdbRelease \
            :app:assembleIslandNormalRelease \
            :app:assembleShelterAdbRelease \
            :app:assembleShelterNormalRelease \
            "-PAFT_RELEASE_STORE_FILE=$RUNNER_TEMP/aftools-release.jks" \
            "-PAFT_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" \
            "-PAFT_RELEASE_KEY_ALIAS=$KEY_ALIAS" \
            "-PAFT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"

      - name: Give APKs their public names
        run: |
          mkdir release
          cp app/build/outputs/apk/islandAdb/release/app-island-adb-release.apk release/AFTools_island_TESTONLY.apk
          cp app/build/outputs/apk/islandNormal/release/app-island-normal-release.apk release/AFTools_island_USUAL.apk
          cp app/build/outputs/apk/shelterAdb/release/app-shelter-adb-release.apk release/AFTools_shelter_TESTONLY.apk
          cp app/build/outputs/apk/shelterNormal/release/app-shelter-normal-release.apk release/AFTools_shelter_USUAL.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.apk \
            --target "$(git rev-parse HEAD)" \
            --title "Android AntiForensic Tools $TAG" \
            --generate-notes
